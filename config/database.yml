default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: task_manager_test
  username: <%= Rails.application.credentials.dig(:development, :db_username) %>
  password: <%= Rails.application.credentials.dig(:development, :db_password)  %>

development:
  <<: *default
  database: <%= Rails.application.credentials.dig(:development, :db_name) %>
  username: <%= Rails.application.credentials.dig(:development, :db_username) %>
  password: <%= Rails.application.credentials.dig(:development, :db_password)  %>
test:
  <<: *default
  database: task_manager_test
production:
  <<: *default
  database: task_manager_production
  username: task_manager
  password: <%= ENV["TASK_MANAGER_DATABASE_PASSWORD"] %>
